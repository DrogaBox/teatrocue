[package]
name = "installer-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Instalar_TeatroCue.exe: activa la licencia de la PC del teatro y copia TeatroCue desde el pendrive."

[lib]
name = "installer_win"
path = "src/lib.rs"

[[bin]]
name = "Instalar_TeatroCue"
path = "src/main.rs"

[dependencies]
qlab-protocol.workspace = true
qlab-license.workspace = true
licencias-db = { path = "../licencias-db" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rpassword = "7"
zeroize = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console"] }
