[package]
name = "teatrocue-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Administración de licencias de TeatroCue: inventario de salas, emisión de license.key y resolución de códigos de emergencia (100% offline)."

[lib]
name = "teatrocue_admin"
path = "src/lib.rs"

[[bin]]
name = "teatrocue-admin"
path = "src/main.rs"

[dependencies]
qlab-license = { workspace = true }
installer-tool = { path = "../installer-tool" }
licencias-db = { path = "../licencias-db" }
eframe = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = "2"
zeroize = "1"

[dev-dependencies]
egui_kittest = { workspace = true }
