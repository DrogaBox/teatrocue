[package]
name = "qlab-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Interfaz gráfica nativa de TeatroCue (egui + wgpu), reactiva y de bajo consumo."

[lib]
name = "qlab_ui"
path = "src/lib.rs"

[[bin]]
name = "teatrocue-ui"
path = "src/main.rs"

[features]
default = []
# Exige un `license.key` válido: sin él la aplicación solo muestra la pantalla de bloqueo.
enforce-license = []

[dependencies]
qlab-protocol.workspace = true
# Memoria compartida con el daemon, y el motor embebido del modo independiente.
qlab-daemon.workspace = true
# Decodificación para dibujar la forma de onda.
qlab-engine.workspace = true
# Parámetros del ecualizador (misma conversión que usa el motor) para dibujar su curva.
qlab-core.workspace = true
eframe.workspace = true
egui_extras.workspace = true
rfd.workspace = true
qlab-license.workspace = true
serde_json.workspace = true
serde.workspace = true

# Silenciar los sonidos del sistema (notificaciones) mientras TeatroCue está abierto.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
ed25519-dalek = "2"
egui_kittest.workspace = true
