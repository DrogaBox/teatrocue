[build]
# Sin target por defecto: nativo Linux; Windows con `--target x86_64-pc-windows-gnu`.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-cpu=x86-64-v3",
    "-C", "target-feature=+avx2,+fma",
]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"
# CPU genérico (solo SSE2): las PC de cabina pueden ser antiguas y sin AVX2; con `x86-64-v3` el programa moría
# con «instrucción ilegal» (0xC000001D) al arrancar en esos equipos.
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static",
    "-C", "link-arg=-static-libgcc",
]

[env]
CPAL_ASIO_DIR = { value = ".sdk/asiosdk", relative = true }
BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnu = "--target=x86_64-w64-mingw32 -I/usr/x86_64-w64-mingw32/include"
